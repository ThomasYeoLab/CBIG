[Dataset Parameters]
simulate_time = 864
# 1200 BOLD frames, 1200 * 0.72 = 864 s. Matches the HCP-YA scan length.
burn_in_time = 72
# Initial seconds discarded to let the dynamics settle.
TR = 0.72
# Repetition time of the empirical fMRI, seconds.
window_size = 83
# Sliding-window length for FCD (≈60 s). TR * window_size ≈ 60 s.

[Simulating Parameters]
n_ROI = 68
# Number of ROIs (Desikan-Killiany cortical parcellation, minus 4 ignored ROIs).
param_dup = 3
# Number of independent noise realisations per parameter set. The simulated
# FC/FCD are averaged across these to reduce variance.
fcd_hist_bins = 10000
# Bin count for the discrete FCD histogram fed to the KS loss.
warm_up_t = 5000
# Length of the additional warm-up loop in Euler frames.
dt_train = 0.005
# Euler step (seconds) used during the CMA-ES training phase.
dt_val = 0.005
# Euler step for validation re-simulation.
dt_test = 0.0005
# Smaller Euler step for the final test re-simulation (more accurate, slower).
wEI_variability_threshold = 0.3
# Rejection threshold on the standard deviation of the sampled wEI profile.
# Set to 0 to disable.

[Dynamic Model Constants]
dynamic_model_name = pfic
I_0 = 0.382
a_E = 310
b_E = 125
d_E = 0.16
tau_E = 0.1
W_E = 1
a_I = 615
b_I = 177
d_I = 0.087
tau_I = 0.01
W_I = 0.7
J_NMDA = 0.15
gamma_kin = 0.641
r_E = 3
# Target excitatory firing rate (Hz). 3 Hz follows Deco et al. 2014.

[Hemodynamic Model Constants]
V0 = 0.02
# Resting blood-volume fraction.
kappa = 0.65
# [s^-1] rate of signal decay.
gamma_hemo = 0.41
# [s^-1] rate of flow-dependent elimination.
tau = 0.98
# [s] hemodynamic transit time.
alpha = 0.33
# Grubb's exponent.
rho = 0.34
# Resting oxygen extraction fraction.

B0 = 3
# Magnetic field strength (T).
TE = 0.0331
# Echo time (s).
r0 = 110
# Intravascular relaxation rate (Hz).
epsilon_hemo = 0.47
# Ratio between intravascular and extravascular MR signal.
