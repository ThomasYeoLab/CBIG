[system]
warmup = 5000
# warm up period (in frames)

t_pre = 0.1
# pre-simulation period (in minutes)
# Reduced from 2.4 for faster example execution

window_size = 10
# sliding window length, usually equals to 60s/TR
# Reduced from 83 (60/0.72) for faster example execution

simulation_period = 1
# simulation period (in minutes)
# Reduced from 14.4 for faster example execution

dt_training = 0.006
# Euler integration time step size for training (in seconds)

dt_validation = 0.006
# Euler integration time step size for validation (in seconds)

dt_test = 0.0005
# Euler integration time step size for testing (in seconds)

TR = 0.72
# TR of BOLD signals (in seconds)

wEI_a = 0
wEI_b = 5
wEI_c = 0
wEI_d = 0
# The coefficients for constraining the searching range of wEI

sigma_scale = 1
# The scale of the noise for constraining the searching range of sigma

wEI_std_threshold = 0
# The threshold for the std of wEI during sampling

use_tqdm = 1
# Set it to 1 to show the progress bar during model training

n_ROI = 68
# The number of ROIs

[Deep learning Model Constants]

predictor_save_path = ../pretrained_models/group_level/pFIC_DK68_predictor.pth
# The path to the pretrained predictor model

d_transformer = 64
# The dimension of the transformer model

[Dynamic Equation Constants]
I_0 = 0.382
# effective external current

a_E = 310
b_E = 125
d_E = 0.16
# excitatory firing rate parameters

tau_E = 0.1
# excitatory time constant (s)
W_E = 1
# excitatory scaling factor for effective external input

a_I = 615
b_I = 177
d_I = 0.087
# inhibitory firing rate parameters

tau_I = 0.01
# inhibitory time constant (s)

W_I = 0.7
# inhibitory scaling factor for effective external input

J_NMDA = 0.15
# excitatory synaptic coupling (nA)

gamma_kin = 0.641
# kinetic parameter

r_E = 3
# [Hz] fixed point of excitatory firing rate

[Hemodynamic Model Constants]
# Balloon-Windkessel hemodynamic model parameters

V0 = 0.02
# resting blood volume fraction

kappa = 0.65
# [s^-1] rate of signal decay

gamma_hemo = 0.41
# [s^-1] rate of flow-dependent elimination

tau = 0.98
# [s] hemodynamic transit time

alpha = 0.33
# Grubb's exponent

rho = 0.34
# resting oxygen extraction fraction

B0 = 3
# magnetic field strength (Tesla)

TE = 0.0331
# TE echo time, s

r0 = 110
# the intravascular relaxation rate (Hz)

epsilon_hemo = 0.47
# the ratio between intravascular and extravascular MR signal
