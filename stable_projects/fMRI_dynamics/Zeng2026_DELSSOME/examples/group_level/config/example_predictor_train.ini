[data preparation]
group_mats_path = ../data/bootstrap_mats
# The path to the group-level myelin, RSFC gradient, SC, FC and FCD CDF

param_path = ../data/param_dataset
# The path to the parameter file with corresponding loss

n_training_group = 2
# The number of training groups (reduced from 64 for faster example execution)

n_val_group = 2
# The number of validation groups (reduced from 14 for faster example execution)

n_test_group = 2
# The number of testing groups (reduced from 13 for faster example execution)

data_epochs = 10
# The number of data epochs to load per group (reduced from 100 for faster example execution)

[predictor training]
epochs = 3
# The number of epochs to train the predictor (reduced from 15 for faster example execution)
batch_size = 256
# The batch size for training the predictor
lr = 1e-3
# The learning rate for training the predictor
gamma = 0.98
# The number of epochs to wait before decaying the learning rate in StepLR
predictor_save_dir = ../examples/group_level/output/predictor/predictor_1
# The path to save the predictor model

[predictor model]
n_regions = 68
# The number of regions
d_param = 3
# The dimension of parameters
d = 64
# The dimension of the hidden layers
