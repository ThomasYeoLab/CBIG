[system]
warmup = 5000
# warm up period (in frames)

t_pre = 0.1
# pre-simulation period (in minutes)
# Reduced from 1.2 for faster example execution

window_size = 10
# sliding window length, usually equals to 60s/TR
# Reduced from 83 (60/0.72) for faster example execution

simulation_period = 1
# simulation period (in minutes)
# Reduced from 14.4 for faster example execution

dt_training = 0.001
# Euler integration time step size for training (in seconds)

dt_validation = 0.001
# Euler integration time step size for validation (in seconds)

dt_test = 0.001
# Euler integration time step size for testing (in seconds)

TR = 0.72
# TR of BOLD signals (in seconds)

use_tqdm = 1
# Set it to 1 to show the progress bar during model training

n_ROI = 68
# The number of ROIs

# NOTE: the Hopf model has no configurable dynamic-equation constants. Its four
# parameters -- a (bifurcation parameter), omega (intrinsic angular frequency),
# G (global coupling scale) and sigma (noise amplitude) -- are exactly what
# CMA-ES searches for, so they come from the parameter vector rather than from
# this file. A [Dynamic Equation Constants] section here would be silently
# ignored. The Hopf model also has no Balloon-Windkessel stage, hence no
# [Hemodynamic Model Constants] section either.
#
# For reference, the search ranges are set in
# ../../../group_level/models/CBIG_DELSSOME_Hopf.py.

[Deep learning Model Constants]

predictor_save_path = ../pretrained_models/group_level/Hopf_DK68_predictor.pth
# The path to the pretrained predictor model. Only read in DELSSOME mode (the
# default); this config is also used by the Euler-mode example, which ignores it.

d_transformer = 64
# The dimension of the transformer model
