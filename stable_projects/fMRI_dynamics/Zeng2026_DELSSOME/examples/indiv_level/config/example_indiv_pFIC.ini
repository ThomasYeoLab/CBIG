# Demo-only overrides, layered on top of the released
# indiv_level/configs/model/pfic/DK68/indiv/config_HCP-YA.ini via
#     CBIG_DELSSOME_indiv_estimate_EI.py --config <this file>
#
# Everything here trades accuracy for speed so the example finishes on a laptop
# CPU. DO NOT copy these values into a real analysis -- run with the released
# config's defaults instead (see the "your own data" section of
# ../../indiv_level/README.md).

[Dataset Parameters]
window_size = 10
# Sliding-window length for FCD, in frames. The real value is ~60 s / TR = 83,
# but the demo simulates only 60 s of BOLD (83 frames), which would leave a
# single FCD window. 10 frames keeps ~74 windows so the KS loss is meaningful.

burn_in_time = 6
# Seconds discarded before FC/FCD are computed. Real runs use 72.

[Simulating Parameters]
dt_test = 0.006
# Euler step for the final test re-simulation. The released config uses 0.0005,
# i.e. 12x finer and 12x slower. Coarsening it is the single biggest reason this
# demo takes minutes instead of an hour -- and the reason its E/I values should
# not be compared against published numbers.

dt_train = 0.006
dt_val = 0.006
# Released config uses 0.005 for both.
